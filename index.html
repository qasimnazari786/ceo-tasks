function askReason(it, label){
  return new Promise(resolve => {
    const dlg = $("#dlg");
    dlg.innerHTML = `<form class="dlg-in" method="dialog"><h2>What is ${esc(it.id)} waiting on?</h2><p class="note" style="margin:0 0 10px">${it.kind === "kc" ? `The other ${esc(it.v.Name)} partners will see this.` : "Shown on the task so you know what to chase."}</p>
      <input id="why" class="inp" value="${esc(it.waiting || "")}" placeholder="For example: a reply from the client">
      <div class="dlg-actions"><button type="button" class="btn" data-c="0">Cancel</button><button type="submit" class="btn primary">Set to ${esc(label)}</button></div></form>`;
    const inp = dlg.querySelector("#why"); let answered = false;
    dlg.querySelector('[data-c="0"]').onclick = () => { answered = true; dlg.close(); resolve(null); };
    dlg.querySelector("form").onsubmit = e => { e.preventDefault(); const v = clean(inp.value); if (!v){ inp.focus(); return; } answered = true; dlg.close(); resolve(v); };
    dlg.onclose = () => { if (!answered) resolve(null); };
    dlg.showModal(); inp.focus();
  });
}

async function setStatus(it, status, opts={}){
  if (it.status === status) return;
  if (it.kind === "local"){
    const ch = {Status: status};
    if (status === "Waiting"){ const r = await askReason(it, "Waiting"); if (r === null) return; ch.WaitingOn = r; }
    const openSubs = (it.subs || []).filter(s => s.Status !== "Done").length;
    if (status === "Done" && openSubs && !(await confirmKCDone(it))) return;
    const prev = it.status;
    if (await saveLocal(it, ch, status === "Done" ? "Marked done" : "Updated")){
      await refresh();
      toast(status === "Done" ? `${it.id} done.` : `${it.id} set to ${status}.`, opts.noUndo || (status === "Done" && openSubs) ? null : {label:"Undo", fn: async () => { const cur = buildItems().find(x => x.key === it.key); if (cur) await setStatus(cur, prev, {noUndo:true}); }});
      if (opts.reopen) openTask(it.key);
    }
  } else if (it.kind === "kc"){
    const ch = {Status: status};
    if (status === "Done" && !(await confirmKCDone(it))) return;
    if (status === "Blocked"){ const r = await askReason(it, "Blocked"); if (r === null) return; ch.BlockedReason = r; }
    const res = await saveKC(it, ch, status === "Done" ? "Marked done" : "Updated");
    if (res){ await refresh(); toast(status === "Done" ? `${it.id} done on the ${it.v.Name} dashboard${res.closed.length ? `, ${res.closed.length} sub-task${res.closed.length===1?"":"s"} closed` : ""}.` : `${it.id} set to ${status} on the ${it.v.Name} dashboard.`); if (opts.reopen) openTask(it.key); }
  }
}

async function toggleDone(key, btn){
  const it = buildItems().find(x => x.key === key); if (!it || !canDone(it)) return;
  if (btn) btn.disabled = true;
  if (it.kind === "kcsub"){
    const checked = it.status !== "Done";
    if (await toggleSub(it, checked)){ await refresh(); toast(checked ? `${it.id} ticked on the ${it.v.Name} dashboard.` : `${it.id} reopened.`); }
    else render();
    return;
  }
  await setStatus(it, it.status === "Done" ? (it.kind === "kc" ? "In progress" : "Not started") : "Done");
  if (btn?.isConnected) btn.disabled = false;
}

/* =====================================================================
   Task sheet
   ===================================================================== */
function openTask(key){
  closeMenu();
  const it = buildItems().find(x => x.key === key); if (!it) return;
  const sheet = $("#sheet"), editable = canDone(it) && it.kind !== "kcsub";
  const v = it.v, vchip = `<span class="vchip" style="${vStyle(v)}"><span class="vdot"></span>${esc(v.Name)}</span>`;
  let body = "";
  if (it.kind === "kcsub"){
    const L = it.L, t = it.parent, all = (L.data.Subtasks || []).filter(s => s.TaskID === t.TaskID).sort((a,b) => (+a.Order||0) - (+b.Order||0));
    body = `<div class="ro">Your sub-task on <b>${esc(t.TaskID)}</b>, led by <b>${esc(t.Lead)}</b>. Due ${it.due ? fmtDate(it.due) : "date not set"}.</div>
      <div class="fld"><span>Task</span><div style="font:700 16px/1.35 var(--font-d)">${esc(t.Title)}</div></div>
      <div class="fld"><span>Sub-tasks</span>${subList(all, L)}</div>
      <p class="note">Tick your own sub-tasks here or on the ${esc(v.Name)} dashboard. Only ${esc(t.Lead)} can change the task itself.</p>`;
  } else {
    const st = statusesFor(it), priSel = ["P1","P2","P3"].map(p => `<option value="${p}" ${it.pri===p?"selected":""}>${PRI_NAME[p]}</option>`).join("");
    body = `<label class="fld"><span>Task</span><textarea class="inp title" name="Title" rows="2" ${editable?"":"readonly"}>${esc(it.title)}</textarea></label>
      <div class="grid3">
        <label class="fld"><span>Status</span><select class="inp" name="Status" ${editable?"":"disabled"}>${st.map(s => `<option ${s===it.status?"selected":""}>${esc(s)}</option>`).join("")}${st.includes(it.status) ? "" : `<option selected>${esc(it.status)}</option>`}</select></label>
        <label class="fld"><span>Due date</span><input class="inp" type="date" name="DueDate" value="${esc(it.due||"")}" ${editable?"":"readonly"}></label>
        <label class="fld"><span>Priority</span><select class="inp" name="Priority" ${editable?"":"disabled"}>${priSel}</select></label>
      </div>
      <label class="fld" id="waitFld" ${WAITS.has(it.status) ? "" : "hidden"}><span>Waiting on</span><input class="inp" name="Waiting" value="${esc(it.waiting||"")}" placeholder="Who or what it is waiting on"></label>
      ${it.kind === "local" ? `<label class="fld"><span>Next step</span><textarea class="inp" name="NextStep" rows="3">${esc(it.next||"")}</textarea></label>` : ""}
      ${it.kind === "kc" && it.desc ? `<div class="fld"><span>Description</span><div class="ro">${esc(it.desc)}</div></div>` : ""}
      <label class="fld"><span>Notes</span><textarea class="inp" name="Notes" rows="3" placeholder="${it.kind === "local" && v.Key === "adroit" ? "The CEO agent reads this on its next run" : "Your notes"}">${esc(it.notes||"")}</textarea></label>
      ${it.kind === "kc" ? `<div class="fld"><span>Sub-tasks</span>${it.subs.length ? subList(it.subs, it.L) : `<div class="note">No sub-tasks yet.</div>`}</div>` : ""}
      ${it.kind === "local" ? `<div class="fld"><span>Sub-tasks${it.subs.length ? ` (${it.subs.filter(s => s.Status === "Done").length} of ${it.subs.length} done)` : ""}</span>${it.subs.length ? subList(it.subs, null) : `<div class="note">No sub-tasks. Add only the steps that matter.</div>`}
        ${CLOSED.has(it.status) ? "" : `<div class="addsub"><input class="inp" id="as-title" placeholder="Add a sub-task, starting with a verb"><input class="inp" type="date" id="as-due" min="${todayISO()}" ${it.due ? `max="${esc(it.due)}"` : ""} aria-label="Sub-task due date"><button type="button" class="btn small" id="as-add">Add</button></div>`}</div>` : ""}
      ${it.why ? `<div class="ro"><b>Why it matters:</b> ${esc(it.why)}</div>` : ""}
      <div class="note">${[it.type ? esc(it.type) : "", it.ref ? `Linked record ${esc(it.ref)}` : "", it.source ? `Source: ${esc(it.source)}` : "", it.row.UpdatedAt ? `Last updated ${esc(fmtStamp(it.row.UpdatedAt))}${it.row.UpdatedBy ? ` by ${esc(it.row.UpdatedBy)}` : ""}` : ""].filter(Boolean).join(" · ")}</div>`;
  }
  sheet.innerHTML = `<form method="dialog" id="taskForm">
    <div class="sheet-h">${vchip}<span class="id">${esc(it.id)}</span>${v.Link && v.DashboardURL ? `<a class="note" href="${esc(v.DashboardURL)}" target="_blank" rel="noopener">Open on the ${esc(v.Name)} dashboard ${ICON.ext}</a>` : ""}<button type="button" class="icon-btn x" data-x aria-label="Close">${ICON.x}</button></div>
    <div class="sheet-b">${body}
      ${editable ? `<div class="dlg-actions" style="margin-top:4px"><button type="button" class="btn" data-x>Cancel</button><button type="submit" class="btn primary">Save</button></div>` : ""}
    </div></form>`;
  sheet.querySelectorAll("[data-x]").forEach(b => b.onclick = () => sheet.close());
  const f = $("#taskForm");
  f.Status?.addEventListener("change", () => { $("#waitFld").hidden = !WAITS.has(f.Status.value); });
  sheet.querySelectorAll("input[data-sub]").forEach(cb => cb.onchange = async () => {
    const sub = it.kind === "local" ? {kind:"localsub", v, id:cb.dataset.sub} : (buildItems().find(x => x.key === `${v.Key}:${cb.dataset.sub}`) || {kind:"kcsub", v, L:it.L, id:cb.dataset.sub});
    cb.disabled = true;
    if (await toggleSub(sub, cb.checked)){ await refresh(); toast(`${cb.dataset.sub} ${cb.checked ? "ticked" : "reopened"}.`); openTask(key); } else cb.checked = !cb.checked;
    cb.disabled = false;
  });
  const asBtn = sheet.querySelector("#as-add"), asTitle = sheet.querySelector("#as-title");
  if (asBtn){ asBtn.onclick = () => addLocalSub(it); asTitle.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); addLocalSub(it); } }; }
  f.onsubmit = async e => { e.preventDefault(); await saveSheet(it, f); };
  sheet.showModal();
}
/* L is the linked venture (only its owner may tick), or null for your own tasks (you can tick any). */
function subList(subs, L){
  const mine = s => !L || s.Owner === L.me;
  return `<ul class="subs">${subs.map(s => { const who = L ? (s.Owner === L.me ? "You" : s.Owner) : (s.Owner || ""); const od = s.Status !== "Done" && s.DueDate && s.DueDate < todayISO();
    return `<li class="${s.Status === "Done" ? "done" : ""}"><input type="checkbox" data-sub="${esc(s.SubtaskID)}" ${s.Status === "Done" ? "checked" : ""} ${mine(s) ? "" : "disabled"} aria-label="${esc(s.Title)}">
    <span class="tt">${esc(s.Title)}</span><span class="own" ${od ? 'style="color:var(--danger);font-weight:700"' : ""}>${esc([who, s.DueDate ? fmtShort(s.DueDate) : ""].filter(Boolean).join(", "))}</span></li>`; }).join("")}</ul>`;
}
async function addLocalSub(it){
  const sheet = $("#sheet"), titleEl = sheet.querySelector("#as-title"), dueEl = sheet.querySelector("#as-due"), btn = sheet.querySelector("#as-add");
  const title = clean(titleEl.value), due = dueEl.value;
  if (!title){ titleEl.focus(); return; }
  if (due && due < todayISO()){ toast("The due date is before today."); return; }
  if (due && it.due && due > it.due){ toast("A sub-task cannot be due after its task."); return; }
  btn.disabled = true; let newId = null;
  const ok = await guarded(async () => {
    await S.ceo.session(async () => {
      const mine = (await S.ceo.readTable("Subtasks")).filter(s => s.TaskID === it.id);
      if (mine.length >= 8) throw new Error("Keep it to 8 sub-tasks or fewer.");
      const n = Math.max(0, ...mine.map(s => +s.Order || 0), ...mine.map(s => +((s.SubtaskID||"").match(/-(\d+)$/)||[0,0])[1])) + 1;
      newId = `${it.id}-${pad(n)}`;
      const stamp = nowStamp(), me = S.me.name || S.me.email || "Me";
      await S.ceo.add("Subtasks", [{SubtaskID:newId, TaskID:it.id, Order:n, Title:title, Owner:"", DueDate:due, Status:"Not started", UpdatedBy:me, UpdatedAt:stamp, CompletedAt:""}]);
      await S.ceo.add("ActivityLog", [logRow(me, "Sub-task added", it.id, `${newId} ${title}`)]);
    });
    return true;
  });
  await refresh();
  if (ok){ toast(`${newId} added.`); openTask(it.key); $("#sheet").querySelector("#as-title")?.focus(); }
  else if (btn.isConnected) btn.disabled = false;
}
async function saveSheet(it, f){
  const val = n => f[n] ? clean(f[n].value) : undefined;
  const status = f.Status.value, ch = {};
  const title = val("Title"); if (!title){ toast("The task cannot be empty."); return; }
  if (title !== it.title) ch.Title = title;
  if ((f.DueDate.value || "") !== (it.due || "")) ch.DueDate = f.DueDate.value;
  if (WAITS.has(status) && !val("Waiting")){ toast("Say what it is waiting on."); f.Waiting.focus(); return; }
  if (it.kind === "local"){
    if (status !== it.status) ch.Status = status;
    if (f.Priority.value !== it.pri) ch.Priority = f.Priority.value;
    if (WAITS.has(status) && val("Waiting") !== (it.waiting || "")) ch.WaitingOn = val("Waiting");
    if (val("NextStep") !== (it.next || "")) ch.NextStep = val("NextStep");
    if (val("Notes") !== (it.notes || "")) ch.Notes = val("Notes");
    if (!Object.keys(ch).length){ $("#sheet").close(); return; }
    if (await saveLocal(it, ch, ch.Status === "Done" ? "Marked done" : "Updated")){ $("#sheet").close(); toast(`${it.id} saved.`); await refresh(); }
  } else {
    if (status !== it.status) ch.Status = status;
    if (PRI_TO_KC[f.Priority.value] !== it.row.Priority && f.Priority.value !== it.pri) ch.Priority = PRI_TO_KC[f.Priority.value];
    if (status === "Blocked" && val("Waiting") !== (it.waiting || "")) ch.BlockedReason = val("Waiting");
    if (val("Notes") !== (it.notes || "")) ch.Notes = val("Notes");
    if (!Object.keys(ch).length){ $("#sheet").close(); return; }
    if (ch.Status === "Done" && !(await confirmKCDone(it))) return;
    const res = await saveKC(it, ch, ch.Status === "Done" ? "Marked done" : "Updated");
    if (res){ $("#sheet").close(); toast(`${it.id} saved on the ${it.v.Name} dashboard.`); await refresh(); }
  }
}

/* =====================================================================
   Add task
   ===================================================================== */
function openAddForm(){
  const vs = ventures(), pre = S.venture || vs[0]?.Key, dlg = $("#sheet");
  dlg.innerHTML = `<form method="dialog" id="addForm">
    <div class="sheet-h"><b class="disp" style="font-size:18px;color:var(--head)">Add a task</b><button type="button" class="icon-btn x" data-x aria-label="Close">${ICON.x}</button></div>
    <div class="sheet-b">
      <label class="fld"><span>Venture</span><select class="inp" name="Venture">${vs.map(v => `<option value="${esc(v.Key)}" ${v.Key===pre?"selected":""} ${v.Link && !S.links[v.Key]?.me ? "disabled" : ""}>${esc(v.Name)}${v.Link ? " (adds to its dashboard)" : ""}</option>`).join("")}</select></label>
      <label class="fld"><span>Task</span><textarea class="inp title" name="Title" rows="2" required placeholder="Start with a verb, for example: Send the revised budget to the partner"></textarea></label>
      <div class="grid3">
        <label class="fld"><span>Due date</span><input class="inp" type="date" name="DueDate" min="${todayISO()}"></label>
        <label class="fld"><span>Priority</span><select class="inp" name="Priority"><option value="P1">P1, high</option><option value="P2" selected>P2, medium</option><option value="P3">P3, low</option></select></label>
        <label class="fld" id="domFld"><span>Area</span><select class="inp" name="Domain"></select></label>
      </div>
      <label class="fld" id="nextFld"><span>Next step</span><textarea class="inp" name="NextStep" rows="2" placeholder="Optional"></textarea></label>
      <label class="fld" id="subsFld"><span>Sub-tasks (optional, one per line)</span><textarea class="inp" name="Subs" rows="3" placeholder="Only the steps that matter, for example:&#10;Collect the three quotes&#10;Send the comparison to the partner"></textarea></label>
      <label class="fld"><span>Notes</span><textarea class="inp" name="Notes" rows="2" placeholder="Optional"></textarea></label>
      <p class="note" id="addNote"></p>
      <div class="dlg-actions"><button type="button" class="btn" data-x>Cancel</button><button type="submit" class="btn primary">Add task</button></div>
    </div></form>`;
  const f = $("#addForm");
  const sync = () => {
    const v = ventureByKey(f.Venture.value), linked = !!v?.Link;
    $("#domFld").hidden = !linked; $("#nextFld").hidden = linked; $("#subsFld").hidden = linked;
    if (linked){ const doms = [...new Set((S.links[v.Key]?.data?.Tasks || []).map(t => t.Domain).filter(Boolean))].sort(); f.Domain.innerHTML = doms.map(d => `<option>${esc(d)}</option>`).join(""); }
    $("#addNote").textContent = linked ? `Added to the ${v.Name} dashboard with you as lead and marked "Needs sub-tasks", so its agent writes the sub-tasks.` : v?.Key === "adroit" ? "The CEO agent picks this up on its next run and adds it to its action list." : "";
  };
  f.Venture.onchange = sync; sync();
  dlg.querySelectorAll("[data-x]").forEach(b => b.onclick = () => dlg.close());
  f.onsubmit = async e => { e.preventDefault(); await createTask(f); };
  dlg.showModal(); f.Title.focus();
}
async function createTask(f){
  const v = ventureByKey(f.Venture.value), title = clean(f.Title.value), due = f.DueDate.value;
  if (!v || !title){ toast("Write the task first."); return; }
  if (due && due < todayISO()){ toast("The due date is before today."); return; }
  const stamp = nowStamp(); let newId = null;
  const btn = f.querySelector('[type="submit"]'); btn.disabled = true;
  let ok;
  if (v.Link === "kc"){
    const L = S.links[v.Key];
    ok = await guarded(async () => {
      await L.store.session(async () => {
        const tasks = await L.store.readTable("Tasks");
        const n = Math.max(0, ...tasks.map(t => +((t.TaskID||"").match(/^KC-(\d{4})$/)||[0,0])[1])) + 1;
        newId = `KC-${String(n).padStart(4,"0")}`;
        await L.store.add("Tasks", [{TaskID:newId, Title:title, Description:"", Domain:f.Domain.value || "Cross-cutting", Lead:L.me, Support:"", Priority:PRI_TO_KC[f.Priority.value], Status:"Needs sub-tasks",
          StartDate:todayISO(), DueDate:due, Recurrence:"None", Source:"CEO Tasks tracker", AllPartnerApproval:"No", BlockedReason:"", Notes:clean(f.Notes.value), CreatedBy:L.me, CreatedAt:stamp, UpdatedBy:L.me, UpdatedAt:stamp, CompletedAt:""}]);
        await L.store.add("ActivityLog", [logRow(L.me, "Task added", newId, `${title} | lead ${L.me} (from CEO Tasks)`)]);
      });
      return true;
    });
  } else {
    ok = await guarded(async () => {
      await S.ceo.session(async () => {
        const tasks = await S.ceo.readTable("Tasks"), pre = v.Prefix || v.Key.slice(0,2).toUpperCase();
        const re = new RegExp(`^${pre}-(\\d{4})$`);
        const n = Math.max(0, ...tasks.map(t => +((t.TaskID||"").match(re)||[0,0])[1])) + 1;
        newId = `${pre}-${String(n).padStart(4,"0")}`;
        const me = S.me.name || S.me.email || "Me";
        await S.ceo.add("Tasks", [{TaskID:newId, Venture:v.Key, Title:title, NextStep:clean(f.NextStep.value), Why:"", Type:"", Priority:f.Priority.value, Status:"Not started", DueDate:due,
          WaitingOn:"", Notes:clean(f.Notes.value), SourceRef:"", Source:"CEO Tasks tracker", CreatedBy:me, CreatedAt:stamp, UpdatedBy:me, UpdatedAt:stamp, CompletedAt:"", AgentSyncedAt:""}]);
        const subs = (f.Subs?.value || "").split("\n").map(clean).filter(Boolean).slice(0, 8);
        if (subs.length) await S.ceo.add("Subtasks", subs.map((t, i) => ({SubtaskID:`${newId}-${pad(i+1)}`, TaskID:newId, Order:i+1, Title:t, Owner:"", DueDate:"", Status:"Not started", UpdatedBy:me, UpdatedAt:stamp, CompletedAt:""})));
        await S.ceo.add("ActivityLog", [logRow(me, "Task added", newId, `${title}${subs.length ? ` | ${subs.length} sub-tasks` : ""}`)]);
      });
      return true;
    });
  }
  if (ok){ $("#sheet").close(); toast(`${newId} added to ${v.Name}.`); S.venture = S.venture && S.venture !== v.Key ? v.Key : S.venture; await refresh(); }
  else if (btn.isConnected) btn.disabled = false;
}

boot();
</script>
